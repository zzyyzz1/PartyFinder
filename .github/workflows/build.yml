name: Build PartyFinder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout PartyFinder
        uses: actions/checkout@v4

      - name: Checkout Ashita v4 SDK
        uses: actions/checkout@v4
        with:
          repository: AshitaXI/Ashita-v4beta
          path: ashita-sdk-src
          sparse-checkout: |
            plugins/sdk
          sparse-checkout-cone-mode: false

      - name: Copy Ashita SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Copy-Item -Path "ashita-sdk-src/plugins/sdk/*" -Destination "sdk" -Recurse -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Win32 Release with warnings as errors
        shell: pwsh
        run: msbuild PartyFinder.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      - name: Verify PE and exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Filter "partyfinder.dll" -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw "partyfinder.dll was not produced." }
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          & $dumpbin /headers $dll.FullName | Tee-Object -FilePath headers.txt
          & $dumpbin /exports $dll.FullName | Tee-Object -FilePath exports.txt
          if (-not (Select-String -Path headers.txt -Pattern "machine \(x86\)" -Quiet)) { throw "DLL is not x86." }
          foreach ($name in @("expCreatePlugin","expDestroyPlugin","expGetInterfaceVersion")) {
            if (-not (Select-String -Path exports.txt -Pattern $name -Quiet)) { throw "Missing export: $name" }
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName "artifact/partyfinder.dll"
          Copy-Item headers.txt "artifact/headers.txt"
          Copy-Item exports.txt "artifact/exports.txt"

      - name: Upload PartyFinder DLL
        uses: actions/upload-artifact@v4
        with:
          name: PartyFinder-Win32-v0.16
          path: artifact/
          if-no-files-found: error
